<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Color Reference Table</title>
</head>
<body>
<table style="color: #ffffff; font-family: Arial, sans-serif; border-collapse: collapse; width: 100%;">
	<!-- First Row: Main Heading spanning 4 columns -->
	<tr>
		<th colspan="4" style="font-size: 24px; color: #ffcc00; font-style: italic; text-align: center; padding: 12px; background-color: #222222;">Color Reference Table</th>
	</tr>
  
	<!-- Second Row: Color Names in <th> with background color and white text for readability -->
	<tr>
		<th style="background-color: #ff0000; color: #ffffff; padding: 10px;">Red</th>
		<th style="background-color: #00ff00; color: #ffffff; padding: 10px;">Green</th>
		<th style="background-color: #0000ff; color: #ffffff; padding: 10px;">Blue</th>
		<th style="background-color: #fc03f0; color: #ffffff; padding: 10px;">Pink</th>
	</tr>
  
	<!-- Third Row: Hexadecimal Colors -->
	<tr>
		<td>#ff0000</td>
		<td>#00ff00</td>
		<td>#0000ff</td>
		<td>#fc03f0</td>
	</tr>
  
	<!-- Fourth Row: RGB Colors -->
	<tr>
		<td>rgb(255, 0, 0)</td>
		<td>rgb(0, 255, 0)</td>
		<td>rgb(0, 0, 255)</td>
		<td>rgb(252, 3, 240)</td>
	</tr>
  
	<!-- Fifth Row: HSL Colors -->
	<tr>
		<td>hsl(0, 100%, 50%)</td>
		<td>hsl(120, 100%, 50%)</td>
		<td>hsl(240, 100%, 50%)</td>
		<td>hsl(303, 98%, 50%)</td>
	</tr>
</table>
</body>
</html>
