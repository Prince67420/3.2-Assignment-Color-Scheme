<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Reference Table</title>
</head>
<body>
  <table style="color: #ffffff; font-family: Arial, sans-serif; border-collapse: collapse; width: 100%;">
    <tr>
      <th colspan="4" style="font-size: 24px; color: #ffcc00; font-style: italic; text-align: center; padding: 12px; background-color: #222222; font-family: Arial, sans-serif;">Color Reference Table</th>
    </tr>

    <tr>
      <th style="background-color: #ff0000; color: #ffffff; padding: 10px;">Red</th>
      <th style="background-color: #00ff00; color: #ffffff; padding: 10px;">Green</th>
      <th style="background-color: #0000ff; color: #ffffff; padding: 10px;">Blue</th>
      <th style="background-color: #fc03f0; color: #ffffff; padding: 10px;">Pink</th>
    </tr>

    <tr>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">#ff0000</td>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">#00ff00</td>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">#0000ff</td>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">#fc03f0</td>
    </tr>

    <tr>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">rgb(255, 0, 0)</td>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">rgb(0, 255, 0)</td>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">rgb(0, 0, 255)</td>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">rgb(252, 3, 240)</td>
    </tr>

    <tr>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">hsl(0, 100%, 50%)</td>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">hsl(120, 100%, 50%)</td>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">hsl(240, 100%, 50%)</td>
      <td style="background-color: #ffffff; color: #000000; text-align: center; padding: 10px;">hsl(303, 98%, 50%)</td>
    </tr>
  </table>
</body>
</html>
